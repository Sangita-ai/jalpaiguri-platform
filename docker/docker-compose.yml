version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: jalpaiguri_postgres
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       jalpaiguri_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    container_name: jalpaiguri_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: jalpaiguri_minio
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout:  20s
      retries:  3

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: jalpaiguri_api
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
      minio:    { condition: service_healthy }
    environment:
      DATABASE_URL:          "postgresql://postgres:password@postgres:5432/jalpaiguri_platform?schema=public"
      JWT_SECRET:            "change-this-in-production-min-32-chars-required"
      JWT_REFRESH_SECRET:    "change-refresh-secret-in-production"
      NODE_ENV:              production
      PORT:                  4000
      FRONTEND_URL:          "http://localhost:3000"
      AWS_ACCESS_KEY_ID:     minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET:             jalpaiguri-platform
      S3_ENDPOINT:           "http://minio:9000"
      AWS_REGION:            ap-south-1
      ANTHROPIC_API_KEY:     "${ANTHROPIC_API_KEY}"
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: jalpaiguri_web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL:      "http://localhost:4000"
      NEXT_PUBLIC_WS_URL:       "http://localhost:4000"
      NEXT_PUBLIC_MAPBOX_TOKEN: "${NEXT_PUBLIC_MAPBOX_TOKEN}"
    ports:
      - "3000:3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: jalpaiguri_nginx
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
